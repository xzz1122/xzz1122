<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>给特别的你</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(to right, #ffecd2 0%, #fcb69f 100%); /* 粉色渐变 */
            font-family: sans-serif;
            text-align: center;
            flex-direction: column; /* 让内容垂直排列 */
            padding: 20px;
            box-sizing: border-box;
            overflow: hidden; /* 防止爱心溢出时出现滚动条 */
        }
        /* --- Flying Heart Styles --- */
        .flying-heart {
            position: fixed;
            width: 15px; /* Smaller hearts */
            height: 15px;
            background-color: #ff7999; /* Lighter pink */
            opacity: 0; /* Start hidden */
            transform: rotate(-45deg);
            /* Animation will be set by JS */
        }
        .flying-heart::before,
        .flying-heart::after {
            content: "";
            position: absolute;
            width: 15px;
            height: 15px;
            background-color: #ff7999;
            border-radius: 50%;
        }
        .flying-heart::before {
            top: -7.5px; /* Adjust for smaller size */
            left: 0;
        }
        .flying-heart::after {
            top: 0;
            left: 7.5px; /* Adjust for smaller size */
        }
        /* Animation for flying to center */
        @keyframes flyToCenter {
            0% {
                opacity: 0.8;
                transform: scale(0.8) rotate(-45deg); /* Start slightly smaller */
            }
            90% {
                 opacity: 1;
                 transform: scale(1.2) rotate(-45deg); /* Slightly larger before disappearing */
            }
            100% {
                /* Target center (adjust if needed) */
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%) scale(0) rotate(-45deg); /* Shrink and disappear at center */
                opacity: 0;
            }
        }

        /* --- Big Heart Styles --- */
        .big-heart {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 50px;
            height: 50px;
            background-color: #e91e63; /* Original pink */
            transform: translate(-50%, -50%) rotate(-45deg) scale(0); /* Start hidden and small */
            opacity: 0;
            animation: scaleUp 1.5s ease-out forwards;
        }
        .big-heart::before,
        .big-heart::after {
            content: "";
            position: absolute;
            width: 50px;
            height: 50px;
            background-color: #e91e63;
            border-radius: 50%;
        }
        .big-heart::before {
            top: -25px;
            left: 0;
        }
        .big-heart::after {
            top: 0;
            left: 25px;
        }
        /* Stagger the appearance of the three big hearts */
        .big-heart:nth-child(2) { animation-delay: 0.2s; }
        .big-heart:nth-child(3) { animation-delay: 0.4s; }

        @keyframes scaleUp {
            0% {
                transform: translate(-50%, -50%) rotate(-45deg) scale(0);
                opacity: 0;
            }
            50% {
                opacity: 1;
            }
            100% {
                transform: translate(-50%, -50%) rotate(-45deg) scale(1.5); /* Scale up */
                opacity: 0; /* Fade out at the end */
            }
        }

        /* --- Final Text Styles --- */
        .love-text {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 5em; /* Large text */
            color: #8B0000; /* Dark Red */
            font-family: 'cursive', sans-serif; /* Popular cursive font */
            opacity: 0; /* Start hidden */
            animation: fadeInText 2s ease-in forwards;
            animation-delay: 1.5s; /* Delay until big hearts finish */
            white-space: nowrap; /* Prevent line break */
        }

        @keyframes fadeInText {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.8);
            }
            100% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
        }
        .container {
            background-color: #fff;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #e91e63; /* 粉色 */
        }
        p {
            color: #555;
            font-size: 1.2em;
            margin-bottom: 30px;
        }
        button {
            padding: 10px 20px;
            font-size: 1em;
            color: #fff;
            background-color: #e91e63; /* 粉色 */
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        button:hover {
            background-color: #c2185b; /* 深一点的粉色 */
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>致我心中的那个你</h1>
        <p>遇见你，是我生命中最美好的意外。你的笑容，点亮了我的世界。我希望能一直陪在你身边。</p>
        <p>你愿意接受我的心意吗？</p>
        <button id="yesBtn">我愿意</button>
        </div>
    <script>
        const yesBtn = document.getElementById('yesBtn');
        const container = document.querySelector('.container'); // Get the container

        yesBtn.addEventListener('click', () => {
            // Optional: Hide the initial container
            container.style.display = 'none';
            startLoveAnimation();
        });

        function startLoveAnimation() {
            const flyingHeartCount = 25;
            const flyDuration = 2000; // 2 seconds for flying hearts animation
            const bigHeartDuration = 1500; // 1.5 seconds for big hearts animation (must match CSS)
            const textDelay = flyDuration + bigHeartDuration - 500; // Adjust timing for text appearance

            // --- 1. Create Flying Hearts ---
            for (let i = 0; i < flyingHeartCount; i++) {
                setTimeout(() => {
                    createFlyingHeart(flyDuration);
                }, i * 50); // Stagger creation
            }

            // --- 2. Create Big Hearts (after flying hearts animation starts) ---
            setTimeout(() => {
                // Remove flying hearts just before big hearts appear
                document.querySelectorAll('.flying-heart').forEach(fh => fh.remove());
                createBigHearts();
            }, flyDuration - 100); // Start slightly before flying hearts fully finish

            // --- 3. Create Final Text (after big hearts animation starts) ---
             setTimeout(() => {
                 // Remove big hearts just before text appears
                 document.querySelectorAll('.big-heart').forEach(bh => bh.remove());
                 createLoveText();
             }, textDelay); // Use calculated delay
        }

        function createFlyingHeart(duration) {
            const heart = document.createElement('div');
            heart.classList.add('flying-heart');

            // Random starting position (edges of the screen)
            const startSide = Math.random() * 4; // 0: top, 1: right, 2: bottom, 3: left
            if (startSide < 1) { // Top
                heart.style.top = '-30px';
                heart.style.left = Math.random() * 100 + 'vw';
            } else if (startSide < 2) { // Right
                heart.style.top = Math.random() * 100 + 'vh';
                heart.style.left = 'calc(100vw + 30px)';
            } else if (startSide < 3) { // Bottom
                heart.style.top = 'calc(100vh + 30px)';
                heart.style.left = Math.random() * 100 + 'vw';
            } else { // Left
                heart.style.top = Math.random() * 100 + 'vh';
                heart.style.left = '-30px';
            }

            // Set animation
            heart.style.animation = `flyToCenter ${duration / 1000}s ease-in forwards`;

            document.body.appendChild(heart);

            // Optional: Remove heart element after animation if not handled by step 2 timeout
            // setTimeout(() => heart.remove(), duration);
        }

        function createBigHearts() {
            for (let i = 0; i < 3; i++) {
                const heart = document.createElement('div');
                heart.classList.add('big-heart');
                // Add specific styles or delays if needed via JS, but CSS handles staggering
                document.body.appendChild(heart);
                 // Optional: Remove heart element after animation if not handled by step 3 timeout
                 // setTimeout(() => heart.remove(), bigHeartDuration + i * 200); // Match CSS delay
            }
        }

        function createLoveText() {
            const text = document.createElement('div');
            text.classList.add('love-text');
            text.textContent = '我爱你';
            document.body.appendChild(text);
            // Text animation is handled by CSS including delay
        }
    </script>
</body>
</html>
